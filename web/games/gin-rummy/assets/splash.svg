<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Gin Rummy">
  <!-- The link-preview card (docs/design/link-previews.md §2), in gin's palette (web/shared/styles/tokens.css):
       the felt, three plain cards, one gold hairline. tools/splash.ts renders it to web/public/games/gin-rummy/splash.png. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1f5a3a"/>
      <stop offset="0.55" stop-color="#123a26"/>
      <stop offset="1" stop-color="#0b2418"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#felt)"/>
  <g transform="translate(960 330)">
    <g transform="rotate(-16) translate(-70 10)">
      <rect x="-90" y="-130" width="180" height="260" rx="14" fill="#f2fdf6" stroke="#0b2418" stroke-width="2"/>
    </g>
    <g transform="rotate(-2) translate(0 -6)">
      <rect x="-90" y="-130" width="180" height="260" rx="14" fill="#f7f4ea" stroke="#0b2418" stroke-width="2"/>
    </g>
    <g transform="rotate(13) translate(70 -14)">
      <rect x="-90" y="-130" width="180" height="260" rx="14" fill="#fbfaf3" stroke="#0b2418" stroke-width="2"/>
      <text x="-70" y="-80" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#0f2318">A</text>
      <text x="0" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="132" fill="#0f2318">♠</text>
    </g>
  </g>
  <text x="96" y="296" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="112" fill="#f2fdf6">Gin Rummy</text>
  <rect x="98" y="326" width="150" height="4" rx="2" fill="#fbbf24"/>
  <text x="98" y="388" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" fill="#f2fdf6" fill-opacity="0.74">Two players. One phone, or online.</text>
  <text x="98" y="560" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#f2fdf6" fill-opacity="0.5" letter-spacing="1">games.sweedler.com</text>
</svg>
