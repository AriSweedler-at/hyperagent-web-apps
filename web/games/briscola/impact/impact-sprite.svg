  <symbol id="sparkle" viewBox="0 0 100 100">
    <path d="M50 4 C52 32 68 48 96 50 C68 52 52 68 50 96 C48 68 32 52 4 50 C32 48 48 32 50 4 Z" fill="currentColor"/>
