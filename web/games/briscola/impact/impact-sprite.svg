    <circle cx="50" cy="26" r="3.5" fill="currentColor"/>
    <ellipse cx="50" cy="52" rx="6" ry="2.5" fill="none" stroke="#c9a961" stroke-width="2"/>
  </symbol>
  <symbol id="impact-denari-a" viewBox="0 0 100 100">
