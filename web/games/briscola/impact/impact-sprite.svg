<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- The clash's impact frames (docs/design/briscola-battle.md §3.5): two hand-drawn symbols per suit
       in currentColor strokes (cream on the baize) with one gold accent, chosen by the WINNING card's
       suit and the variant's A/B digit; a 4-point sparkle for a briscola's win. Inlined by main.ts and
       the stories boot: nothing is fetched during play. Never a saturated red (WCAG 2.3.1). -->
  <symbol id="impact-coppe-a" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <path d="M20 62 Q35 30 50 58 Q65 30 80 62"/>
      <path d="M28 74 Q40 52 50 70 Q60 52 72 74"/>
      <path d="M50 44 V22"/>
      <path d="M36 30 L30 16"/>
      <path d="M64 30 L70 16"/>
    </g>
    <g fill="currentColor">
      <circle cx="30" cy="12" r="2.6"/><circle cx="70" cy="12" r="2.6"/><circle cx="50" cy="16" r="3"/>
      <circle cx="18" cy="52" r="2"/><circle cx="82" cy="52" r="2"/>
    </g>
    <path d="M42 84 Q50 78 58 84" fill="none" stroke="#c9a961" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="impact-coppe-b" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <ellipse cx="50" cy="52" rx="14" ry="6" stroke-width="3"/>
      <ellipse cx="50" cy="52" rx="26" ry="12" stroke-width="2.4" stroke-dasharray="10 5"/>
      <ellipse cx="50" cy="52" rx="40" ry="19" stroke-width="1.8" stroke-dasharray="4 7"/>
      <path d="M50 44 V30"/>
