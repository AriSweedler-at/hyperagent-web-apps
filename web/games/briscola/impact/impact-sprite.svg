    <circle cx="50" cy="50" r="5" fill="none" stroke="#c9a961" stroke-width="2"/>
    <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <path d="M50 30 V14"/><path d="M50 70 V86"/><path d="M30 50 H14"/><path d="M70 50 H86"/>
      <path d="M36 36 L26 26"/><path d="M64 36 L74 26"/><path d="M36 64 L26 74"/><path d="M64 64 L74 74"/>
