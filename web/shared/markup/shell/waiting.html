  <!-- HOST WAITING -->
  <div id="hostWaitScreen" class="hidden">
    <h1>{{hostWaitTitle}}</h1>
    <div class="subtitle">{{hostWaitSubtitle}}</div>
    <div {{centeredBox}}>
      <label>Room code</label>
      <div class="room-code" id="roomCode">----</div>
      <button class="btn btn-secondary btn-sm" id="shareCodeBtn"{{mt10}}>Share invite</button>
    </div>
    <div {{centeredBox}}>
      <div id="hostWaitStatus" {{pulseMuted}}>{{openingMsg}}</div>
{{hostWaitList}}
      <div class="empty-note"{{pt10}}>{{keepOpenNote}}</div>
    </div>
    <button class="btn btn-go btn-block hidden" id="startGameBtn">{{startLabel}}</button>
    <button class="btn btn-ghost btn-block" id="cancelHostBtn"{{mt10}}>Cancel</button>
  </div>

  <!-- GUEST WAITING -->
  <div id="guestWaitScreen" class="hidden">
    <h1>Joining…</h1>
    <div {{centeredBox}}>
      <div id="guestWaitStatus" {{pulseMuted}}>Connecting…</div>
{{guestWaitList}}
    </div>
    <button class="btn btn-ghost btn-block" id="cancelGuestBtn">Back</button>
  </div>
