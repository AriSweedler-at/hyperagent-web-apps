<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ari's web apps</title>
<link rel="icon" href="./shared/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="./shared/favicon.ico">
<style>
  :root{--bg:#0f1115;--fg:#e8e6e1;--muted:#9a9891;--card:#181b22;--line:#262a33;--accent:#e0b35a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:960px;margin:0 auto;padding:28px 16px 32px}
  h1{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 .15em}
  p.lede{color:var(--muted);margin:0 0 20px;font-size:.95rem}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  a.card{display:flex;align-items:center;min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
  a.card:hover{border-color:var(--accent);transform:translateY(-1px)}
  a.card h2{margin:0;font-size:1rem;font-weight:600;line-height:1.3}
  p.tools{margin:20px 0 0;color:var(--muted);font-size:.9rem}
  p.tools a{color:var(--fg)}
  footer{margin-top:24px;color:var(--muted);font-size:.8rem}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Ari's web apps</h1>
  <p class="lede">Single-file browser games. Nothing to install.</p>
  <div class="grid">
    <a class="card" href="games/gin-rummy/"><h2>🃏 Gin Rummy</h2></a>
    <a class="card" href="games/fidice/"><h2>🎲 Fidice</h2></a>
    <a class="card" href="games/backgammon/"><h2>⚅⚄ Sheshbesh</h2></a>
    <a class="card" href="games/briscola/"><h2>🃏 Briscola</h2></a>
    <a class="card" href="games/rps/"><h2>✊✋✌️ Rock Paper Scissors</h2></a>
  </div>
  <p class="tools">Tools: <a class="tool" href="games/ui-sandbox/">UI Sandbox</a></p>
  <footer>Source: <a href="https://github.com/AriSweedler-at/hyperagent-web-apps">github.com/AriSweedler-at/hyperagent-web-apps</a></footer>
</main>
</body>
</html>
