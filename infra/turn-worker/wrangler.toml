name = "hyperagent-web-apps-turn"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of origins allowed to fetch credentials. Empty = allow any origin.
ALLOWED_ORIGINS = "https://arisweedler-at.github.io"
# Credential lifetime in seconds (300–86400). A game session should fit inside it.
TTL_SECONDS = "7200"

# The TURN key's ID is not secret; the API token that pairs with it is.
TURN_KEY_ID = "acdb9db7a19e6f0d65998670bd779bbe"

# Secret (set with `wrangler secret put TURN_KEY_API_TOKEN`, never commit it):
#   TURN_KEY_API_TOKEN   — shown once when the TURN key is created (Realtime → TURN)
