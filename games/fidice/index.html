<!DOCTYPE html>
<html lang="en">
<head>
    <meta property="og:title" content="Fidice — one-cup liar's dice (Kezar Lake)">
    <meta property="og:type" content="website">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Fidice — one-cup liar's dice (Kezar Lake)">
    <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fidice — one-cup liar's dice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../../shared/ice.js"></script>
<style>
:root{
  /* Kezar Lake, Maine — pines, water, cabin wood, birch */
  --felt:#1f4d3a; --felt-dark:#153627; --felt-light:#2e6b4f; --pine:#1f4d3a; --pine-light:#5f8f72; --moss:#a6bfa3;
  --lake:#2b6f9e; --lake-deep:#1d4f73; --lake-light:#7fbde0; --mist:#dcecf5;
  --wood:#8b5a2b; --wood-dark:#5c3a1a; --wood-light:#c68e4f; --timber:#3a2716;
  --cream:#f6efe2; --cream-2:#ece1cc; --birch:#fbf7ef; --ink:#22302a; --muted:#66746c;
  --accent:#d9782f; --accent-dark:#a9561d; --gold:#e6a93c; --red:#b8433a; --blue:var(--lake);
  --card:var(--birch); --line:#dfd3bd; --radius:16px; --shadow:0 8px 26px rgba(21,54,39,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100%;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(180deg,var(--mist) 0,#eef5f9 30%,#d9e9f2 60%,#bcd9ea 100%);background-attachment:fixed}
body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:32vh;pointer-events:none;z-index:0;opacity:.8;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 420' preserveAspectRatio='none'><g fill='%238fb3a0' opacity='.55'><path d='M0 260 L40 180 L80 260 L110 150 L150 260 L190 200 L230 260 L270 120 L320 260 L350 190 L390 260 L430 140 L480 260 L520 200 L560 260 L600 110 L650 260 L690 190 L730 260 L770 150 L820 260 L860 210 L900 260 L940 130 L990 260 L1030 190 L1070 260 L1110 160 L1160 260 L1200 200 L1200 420 L0 420Z'/></g><g fill='%231f4d3a' opacity='.9'><path d='M0 300 L30 230 L60 300 L90 200 L125 300 L160 250 L195 300 L230 170 L275 300 L305 240 L340 300 L380 190 L425 300 L460 250 L500 300 L540 160 L590 300 L625 240 L660 300 L700 200 L745 300 L780 255 L815 300 L855 180 L905 300 L940 245 L975 300 L1015 210 L1060 300 L1095 250 L1130 300 L1170 190 L1200 260 L1200 420 L0 420Z'/></g><path fill='%232b6f9e' d='M0 300 L1200 300 L1200 420 L0 420Z'/><g stroke='%237fbde0' stroke-width='3' fill='none' opacity='.8' stroke-linecap='round'><path d='M60 330 q20 -8 40 0 t40 0'/><path d='M320 355 q20 -8 40 0 t40 0 t40 0'/><path d='M640 335 q20 -8 40 0 t40 0'/><path d='M900 365 q20 -8 40 0 t40 0 t40 0'/><path d='M180 390 q20 -8 40 0 t40 0'/><path d='M1040 395 q20 -8 40 0 t40 0'/><path d='M500 400 q20 -8 40 0 t40 0'/></g></svg>") center bottom / 100% 100% no-repeat}
header,main{position:relative;z-index:1}
h1,h2,h3,.brand{font-family:'Fredoka',sans-serif;letter-spacing:.2px;margin:0}
button{font-family:inherit;font-size:15px;font-weight:700;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;transition:transform .08s,box-shadow .12s,background .12s}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(180deg,#e2863d 0,var(--accent) 100%);color:#fff;box-shadow:0 3px 0 var(--accent-dark)}
.btn-primary:hover:not(:disabled){background:linear-gradient(180deg,#ee9550 0,#de8038 100%)}
.btn-secondary{background:var(--cream-2);color:var(--timber);border:1.5px solid #cdbc9c;box-shadow:0 2px 0 #cdbc9c}
.btn-secondary:hover:not(:disabled){background:#e6d8bd}
.btn-danger{background:var(--red);color:#fff;box-shadow:0 3px 0 #9d332b}
.btn-ghost{background:transparent;color:var(--muted);padding:6px 10px}
.btn-big{font-size:18px;padding:14px 24px;border-radius:14px}
input,select{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #e8843a33}
label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
a{color:var(--blue)}
.hidden{display:none!important}

/* header */
header{background:linear-gradient(180deg,#2a5e46 0,var(--pine) 100%);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:6px solid var(--wood);box-shadow:0 6px 0 var(--wood-dark),0 10px 24px #0003}
.badge{font-family:'Caveat',cursive;font-size:17px;font-weight:700;color:#f3e3c2;background:#0002;border:1.5px dashed #f3e3c266;padding:2px 12px;border-radius:99px;line-height:1.3;white-space:nowrap}
@media(max-width:700px){.badge{display:none}}
.brand{font-size:26px;display:flex;align-items:center;gap:8px;cursor:pointer}
.brand .cup{font-size:24px}
nav.tabs{display:flex;gap:4px;margin-left:auto;background:#0002;padding:4px;border-radius:14px}
nav.tabs button{background:transparent;color:#fffc;padding:8px 16px;border-radius:10px;font-weight:700}
nav.tabs button.active{background:var(--birch);color:var(--pine)}
.pill{font-size:12px;font-weight:800;background:#fff2;padding:4px 10px;border-radius:99px;letter-spacing:.5px}

main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:22px 18px 40px}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;border-top:4px solid var(--wood-light)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.spacer{flex:1}

/* tooltip */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;line-height:1.35;padding:7px 10px;border-radius:8px;white-space:normal;width:max-content;max-width:240px;text-align:center;z-index:50;pointer-events:none;box-shadow:0 4px 14px #0004}
[data-tip]:hover::before,[data-tip]:focus-visible::before{content:"";position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink);z-index:50}
.tip-below[data-tip]:hover::after{bottom:auto;top:calc(100% + 8px)} .tip-below[data-tip]:hover::before{bottom:auto;top:calc(100% + 2px);border-top-color:transparent;border-bottom-color:var(--ink)}

/* menu */
/* The menu sits on a translucent birch card so its small print stays legible over the shoreline artwork. */
.menu{max-width:520px;margin:30px auto;text-align:center;background:rgba(251,247,239,.94);border-radius:var(--radius);padding:26px 30px 22px;box-shadow:var(--shadow);border-top:4px solid var(--wood-light)}
.menu .links button{background:none;color:var(--lake-deep);font-weight:700;padding:4px}
.menu h1{font-size:60px;color:var(--pine);text-shadow:0 2px 0 #fff8}
.menu .where{font-family:'Caveat',cursive;font-size:24px;color:var(--lake-deep);margin-top:-4px}
.menu .scene{font-size:34px;letter-spacing:6px;margin:6px 0 2px;filter:drop-shadow(0 2px 2px #0002)}
.menu .tag{color:var(--muted);font-size:17px;margin:6px 0 26px}
.menu .btn-big{width:100%}
.menu .dice-hero .die{width:34px;height:34px;border-radius:8px}
.menu-options{display:flex;flex-direction:column;gap:10px;margin-top:6px;text-align:left}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);color:var(--ink);box-shadow:none;cursor:pointer;transition:border-color .12s,transform .12s}
.opt:hover{border-color:var(--lake-light);transform:translateY(-1px)}
.opt.primary{background:linear-gradient(180deg,#2a5e46,var(--pine));color:#fff;border-color:var(--pine)}
.opt.primary .opt-s,.opt.primary .opt-go{color:#fffc}
.opt-ic{font-size:28px;width:38px;text-align:center;flex:none}
.opt-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.opt-t{font-family:Fredoka;font-size:19px;line-height:1.1}
.opt-s{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.opt-go{font-size:26px;color:var(--muted);flex:none}
.difficulty{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0 6px}
.difficulty label{font-weight:800;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--lake-light);border-radius:12px;overflow:hidden;background:var(--birch)}
.seg-btn{background:none;border:0;border-radius:0;padding:9px 20px;font-weight:800;color:var(--lake-deep);cursor:pointer;box-shadow:none}
.seg-btn+.seg-btn{border-left:2px solid var(--lake-light)}
.seg-btn.on{background:var(--lake);color:#fff}
.seg-btn:hover:not(.on){background:var(--mist)}
#difficultyBlurb{max-width:380px;line-height:1.35}
/* computer configuration page */
.cfg .cfg-current{margin:10px 0 4px;font-size:15px;color:var(--lake-deep)}
.cfg-section{margin-top:18px}
.cfg-section h3{font-family:Nunito;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cfg-card{text-align:left;background:var(--birch);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;color:var(--ink);box-shadow:none;font-weight:600;position:relative;transition:border-color .12s,transform .12s}
.cfg-card:hover{border-color:var(--lake-light);transform:translateY(-1px)}
.cfg-card.on{border-color:var(--lake);background:#e3f1f8;box-shadow:0 0 0 3px #7fbde055}
.cfg-card.on::after{content:"✓";position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--lake);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.cfg-name{font-family:Fredoka;font-size:18px;color:var(--pine)}
.cfg-blurb{font-size:13px;color:var(--muted);font-weight:600;line-height:1.35}
.cfg-tag{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:var(--pine);color:#fff;border-radius:6px;padding:2px 7px}
.cfg-learner{grid-column:span 2}
@media(max-width:560px){.cfg-learner{grid-column:span 1}}
.cfg-gens{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfg-gens .seg-btn{padding:6px 12px;font-size:13px}
.bot-strategy{font-size:13px;font-weight:800;color:var(--lake-deep)}
/* pass the phone */
.locals{display:flex;flex-direction:column;gap:8px}
.locals input{width:100%}
.handoff{min-height:min(70vh,560px);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;color:#fff;user-select:none}
.handoff.cover{background:linear-gradient(180deg,#2a5e46,var(--pine));cursor:pointer;box-shadow:var(--shadow)}
.handoff.cover .hand{font-size:64px}
.handoff.cover .big{font-family:Fredoka;font-size:clamp(28px,6vw,44px)}
.handoff.cover .sub{font-size:17px;opacity:.9}
.handoff.confirm{background:var(--felt-dark);box-shadow:var(--shadow)}
.handoff.confirm .sub{font-size:15px;opacity:.85}
/* score-keeping tables */
.lost{align-self:flex-start;font-size:12px;font-weight:800;background:#fdf1e6;color:var(--accent-dark);border-radius:8px;padding:2px 8px}
.lost.clean{background:#e3f0e4;color:var(--pine)}
.scoreboard{display:flex;flex-direction:column;gap:6px;width:min(420px,100%);margin:6px auto}
.score-row{display:flex;align-items:center;gap:10px;background:var(--birch);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700}
.score-row.top{background:#fdf1e6;border:2px solid var(--gold)}
.score-row .place{width:28px;text-align:center;font-family:Fredoka;color:var(--muted)}
.score-row .n{font-variant-numeric:tabular-nums;color:var(--accent-dark)}
.menu .or{margin:18px 0 10px;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:1px}
.menu .join{display:flex;gap:8px}
.menu .join input{flex:1;text-transform:uppercase;letter-spacing:3px;font-weight:800;text-align:center;font-size:18px;background:var(--birch)}
.menu .links{margin-top:26px;display:flex;gap:18px;justify-content:center}
.menu .links button{background:none;color:var(--blue);font-weight:700;padding:4px}
.dice-hero{display:flex;gap:10px;justify-content:center;margin-bottom:12px}

/* dice */
.dice{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.reveal .dice{justify-content:center;gap:10px}
.bidcard .dice{gap:4px}
.die{width:46px;height:46px;border-radius:10px;background:center/100% 100% no-repeat;box-shadow:0 3px 6px #0003;position:relative;flex:none}
.die.sm{width:30px;height:30px;border-radius:7px} .die.xs{width:22px;height:22px;border-radius:5px}
.die.hidden-face{background:repeating-linear-gradient(45deg,#e9e2d0 0 6px,#f6f1e5 6px 12px);border:1.5px solid #e6e0d2}
.die.hidden-face::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:Fredoka;font-weight:700;color:#9b917c;font-size:22px}
.die.sm.hidden-face::after{font-size:15px}
/* abstract shape dice (ladder top tier): symbols instead of pips */
.die.abs{display:grid;place-items:center;background:var(--birch);border:1.5px solid #e6e0d2;font-size:19px;line-height:1;box-shadow:0 2px 4px #0003}
.die.abs.sm{font-size:19px} .die.abs.xs{font-size:14px}
.die.abs.abs-pine{background:#e3f0e4;border-color:#b9d3bd}
.die.abs.abs-kayak{background:#dcecf5;border-color:#a9cfe6}
.die.abs.abs-blank{background:repeating-linear-gradient(45deg,#f6f1e5 0 5px,#fbf7ef 5px 10px);border-color:#e6e0d2}
.die.abs[class*="abs-step"]{border-color:#a9cfe6}
.die.abs.abs-step1{background:linear-gradient(0deg,var(--lake) 20%,var(--birch) 20%)}
.die.abs.abs-step2{background:linear-gradient(0deg,var(--lake) 40%,var(--birch) 40%)}
.die.abs.abs-step3{background:linear-gradient(0deg,var(--lake) 60%,var(--birch) 60%)}
.die.abs.abs-step4{background:linear-gradient(0deg,var(--lake) 80%,var(--birch) 80%)}
.die.abs.abs-step5{background:var(--lake)}
.die.clickable{cursor:pointer;transition:transform .1s,box-shadow .1s}
.die.clickable:hover{transform:translateY(-3px);box-shadow:0 6px 12px #0003}
.die.selected{outline:3px solid var(--accent);outline-offset:2px}
.die.rolling{animation:wobble .45s ease}
@keyframes wobble{0%{transform:rotate(0)}25%{transform:rotate(-14deg) translateY(-6px)}50%{transform:rotate(12deg)}75%{transform:rotate(-8deg) translateY(-3px)}100%{transform:rotate(0)}}

/* ladder */
.ladder-wrap{display:grid;grid-template-columns:1fr;gap:16px}
.ladder-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ladder-head .legend{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--cream-2);color:var(--ink);cursor:pointer;border:1.5px solid transparent}
.chip:hover{border-color:var(--accent)}
.ladder{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:4px solid var(--wood-light)}
.lrow.catrow{background:linear-gradient(180deg,#2a5e46,var(--pine));color:#fff;cursor:pointer;border-bottom:3px solid var(--wood);min-height:58px}
.lrow.catrow.open{position:sticky;top:0;z-index:5}
.lrow.catrow:hover{background:var(--felt-light)}
.lrow.catrow .rank,.lrow.catrow .rank b,.lrow.catrow .sub{color:#fffc}
.lrow.catrow .nm{font-family:Fredoka;font-size:17px}
.lrow.catrow .nm::before{content:"▸";display:inline-block;width:16px;color:var(--gold);transition:transform .15s}
.lrow.catrow.open .nm::before{transform:rotate(90deg)}
.lrow.hand{padding-left:34px}
.ladder .cat .n{margin-left:auto;font-size:12px;font-weight:800;opacity:.8;font-family:Nunito}
.ladder .cat .blurb{font-family:Nunito;font-size:12.5px;font-weight:600;opacity:.85}
.lrow{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);position:relative;min-height:50px}
.lrow .rank{font-size:10px;font-weight:800;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.5px}
.lrow .rank b{display:block;font-size:15px;color:var(--ink);white-space:nowrap}
.lrow .nm{font-weight:700;font-size:15px}
.lrow .sub{font-size:12.5px;color:var(--muted);font-weight:600}
.lrow .dice{display:flex;gap:4px}
.lrow.group{cursor:pointer;background:#fff}
.lrow.group:hover{background:#fbf8f0}
.lrow.group .nm::before{content:"▸";display:inline-block;width:16px;color:var(--accent);transition:transform .15s}
.lrow.group.open .nm::before{transform:rotate(90deg)}
.lrow.group{padding-left:34px}
.lrow.variant{background:#f3ece0;padding-left:56px}
.lrow.variant .nm{font-weight:600;font-size:14px}
.lrow.mark-bid{background:#fdf1e6!important;box-shadow:inset 4px 0 0 var(--accent)}
.lrow.mark-cup{box-shadow:inset -4px 0 0 var(--lake)}
.lrow.mark-bid.mark-cup{box-shadow:inset 4px 0 0 var(--accent),inset -4px 0 0 var(--blue)}
.tab-marker{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:#fff;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:2}
.tab-marker.bid{right:8px;background:var(--accent)} .tab-marker.cup{left:8px;background:var(--blue)}
.lrow.variant .tab-marker.cup{left:2px}
.lrow.in-range{background:#eef7f1}
.lrow.dim{opacity:.5}

/* lobby */
.code{font-family:Fredoka;font-size:44px;letter-spacing:8px;color:var(--felt-dark)}
.share{background:var(--cream-2);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.share input{flex:1;font-size:13px;background:#fff}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.seat{background:var(--birch);border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent;position:relative}
.seat.me{border-color:var(--accent)}
.seat.holder{background:#e3f1f8;border-color:var(--lake-light)}
.bot-controls{display:flex;flex-direction:column;gap:6px}
.bot-controls .bot-name{width:100%;padding:6px 8px;font-size:13px;font-weight:700;border-radius:8px;border:1.5px solid var(--line);background:#fff}
.bot-controls .bot-pick{flex:1;padding:4px 6px;font-size:12px;font-weight:700;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.seat.out{opacity:.5}
.seat .nm{font-weight:800;display:flex;gap:6px;align-items:center}
.seat .lives{letter-spacing:2px;font-size:14px}
.seat .status{font-size:12px;color:var(--muted);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:#7bc47f;display:inline-block}
.dot.off{background:#c9473d}
.seat .cupbadge{position:absolute;top:-10px;right:-6px;font-size:22px;filter:drop-shadow(0 2px 2px #0003)}
.empty-seat{border:2px dashed var(--line);background:transparent;color:var(--muted);justify-content:center;align-items:center;font-weight:700;font-size:13px}

/* game */
.game{display:grid;grid-template-columns:1fr 340px;gap:16px}
@media(max-width:900px){.game{grid-template-columns:1fr}}
.table{border-radius:22px;padding:22px;color:#fff;min-height:300px;display:flex;flex-direction:column;gap:18px;position:relative;
  background:repeating-linear-gradient(90deg,#8a5a2e 0 118px,#7a4d25 118px 122px,#94633a 122px 240px,#6f4520 240px 244px),linear-gradient(#8a5a2e,#8a5a2e);
  box-shadow:inset 0 0 0 10px var(--timber),inset 0 0 60px #0004,var(--shadow)}
.table::after{content:"";position:absolute;inset:10px;border-radius:14px;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 9px,#0000000a 9px 10px)}
.table>*{position:relative;z-index:1}
.table h3{font-size:14px;letter-spacing:1px;text-transform:uppercase;opacity:.8;font-family:Nunito;font-weight:800}
.zone{background:linear-gradient(180deg,#2b6f9ecc,#1d4f73dd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 2px 0 #7fbde066,inset 0 -2px 0 #0003}
.zone .dice{display:flex;gap:10px;min-height:46px;flex-wrap:wrap;align-items:center}
.zone .hint{font-size:13px;opacity:.85}
.cup-visual{display:flex;align-items:center;gap:14px}
.cup-icon{font-size:48px;line-height:1}
.bidcard{background:var(--birch);color:var(--ink);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;border-left:6px solid var(--accent)}
.bidcard .lbl{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.bidcard .val{font-family:Fredoka;font-size:22px}
.bidcard .who{font-size:13px;color:var(--muted);font-weight:700}
.turnbar{background:linear-gradient(180deg,#f0b64a,#e39b2a);color:#3b2d0c;border-radius:12px;padding:10px 14px;font-weight:800;text-align:center;box-shadow:0 3px 0 #b7771c}
.turnbar.wait{background:#fff2;color:#fff;box-shadow:none;border:1.5px dashed #ffffff55}
.actions{display:flex;flex-direction:column;gap:10px}
.actions .step{background:#fff;border-radius:12px;padding:12px 14px;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.actions .step h4{margin:0;font-family:Fredoka;font-size:16px;display:flex;gap:8px;align-items:center}
.actions .step h4 .num{background:var(--lake);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-family:Nunito}
.actions .step p{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.bidpick{display:flex;flex-direction:column;gap:10px}
.bidsearch{position:relative}
.bidsearch input{width:100%;font-size:15px;padding:11px 14px;border-radius:12px;border:2px solid var(--lake-light);background:var(--birch)}
.bidsearch input:focus{border-color:var(--lake)}
.bidlist{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--birch);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #0004;max-height:300px;overflow:auto;padding:4px}
.bidopt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer}
.bidopt:hover,.bidopt.hi{background:#e3f1f8}
.bidopt .nm{font-weight:800;font-size:14px} .bidopt .sub{font-size:12px;color:var(--muted);font-weight:600}
.bidopt>div:first-child{flex:1;min-width:0}
.tag-g{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:var(--pine);color:#fff;border-radius:6px;padding:1px 6px;vertical-align:middle;margin-left:4px}
.bidsel{background:var(--cream-2);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;min-height:52px}
.bidsel .lbl{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.bidsel .val{font-family:Fredoka;font-size:19px} .bidsel .who{font-size:12px;color:var(--muted);font-weight:700}
.bidsel>div:first-child{flex:1}
.side{display:flex;flex-direction:column;gap:14px}
.log{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;max-height:340px;overflow:auto;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.log div{padding:6px 8px;border-radius:8px;background:var(--cream-2);border-left:3px solid var(--moss)}
.log div.big{background:#fdf1e6;font-weight:700}
.log .t{color:var(--muted);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;margin-right:7px;letter-spacing:.2px}
.reveal{background:#fff;color:var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.reveal .bigval{font-size:17px}
.reveal .res{font-family:Fredoka;font-size:22px}
.reveal .res.good{color:var(--felt)} .reveal .res.bad{color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:99;box-shadow:0 6px 20px #0005;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:#fdf1e6;border:1.5px solid #f4c9a5;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
.banner.err{background:#fbe6e4;border-color:#eaa7a1}

/* spectator */
.spec{display:grid;grid-template-columns:260px 1fr 260px;gap:16px;align-items:start}
@media(max-width:1000px){.spec{grid-template-columns:1fr}.ticker{position:static!important}}
.ticker{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.ticker .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.ticker .card h3{font-size:18px;display:flex;align-items:center;gap:8px}
.ticker .card.cup{border-top:6px solid var(--lake)} .ticker .card.bid{border-top:6px solid var(--accent)}
.ticker .bigval{font-family:Fredoka;font-size:22px}
.ticker .dice{display:flex;gap:6px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.toggle input{width:auto}
.bidhist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.bidhist div{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:6px;background:var(--cream-2)}
.bidhist div.cur{background:#fdf1e6;font-weight:800}

/* rules */
.rules{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.rules h2{font-size:28px;color:var(--felt-dark)}
.rules h3{font-size:19px;color:var(--felt-dark);margin-top:4px}
.rules p,.rules li{line-height:1.55;font-size:15.5px}
.rules .steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;padding:0;list-style:none}
.rules .steps li{background:var(--cream-2);border-radius:12px;padding:12px 14px 12px 52px;position:relative}
.rules .steps li::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--felt);color:#fff;display:grid;place-items:center;font-family:Fredoka;font-weight:700}
.rules .ex{background:#fff;border-left:4px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0}
.kbd{background:var(--cream-2);padding:2px 7px;border-radius:6px;font-weight:800;font-size:13px}

/* ---------- phones: never spend more height than needed ---------- */
@media(max-width:560px){
  main{padding:10px 10px 28px}
  header{padding:8px 10px;gap:8px}
  .brand{font-size:22px}
  nav.tabs{padding:3px;gap:2px}
  nav.tabs button{padding:6px 10px;font-size:13px}
  .panel{padding:14px;border-radius:14px}
  .menu{margin:12px auto;padding:16px 14px 14px}
  .menu h1{font-size:44px}
  .menu .tag{margin:4px 0 14px;font-size:15px}
  /* five dice always fit on one line */
  .dice{flex-wrap:nowrap}
  .die{width:40px;height:40px;border-radius:9px}
  .die.sm{width:28px;height:28px;border-radius:6px}
  .die.hidden-face::after{font-size:18px}
  .zone .dice{gap:6px;min-height:40px}
  .reveal .dice{gap:6px}
  .table{padding:14px;gap:12px;border-radius:16px}
  .zone{padding:12px;gap:8px}
  .actions .step{padding:10px 12px;gap:6px}
  .bidcard{padding:10px 12px;gap:10px}
  .bidlist{max-height:min(300px,50vh)}
  /* bid suggestions: the five dice on their own line, the words beneath */
  .bidopt{flex-direction:column;align-items:flex-start;gap:4px}
  .bidopt .dice{order:-1}
  .bidopt .nm{font-size:15px}
  /* seats at the table: one row you can swipe through. The grid column must not grow to fit it (min-width:0),
     or the swipe row would widen the whole table past the phone instead of scrolling. */
  .game>*{min-width:0}
  .game .seats{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .game .seat{flex:0 0 150px;scroll-snap-align:start}
  /* in the lobby the chairs stack — there is a name box and a strategy to read on each */
  #screen-lobby .seats{grid-template-columns:1fr}
  /* the ladder: the dice sit on their own line, the words beneath them */
  .lrow{grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 12px;min-height:0}
  .lrow .dice{grid-column:1 / -1;order:-1}
  .lrow .rank{text-align:left}
  .lrow.hand,.lrow.group{padding-left:12px}
  .lrow.variant{padding-left:22px}
  .lrow.catrow{min-height:0}
  .ladder-head h2{font-size:20px!important}
  .ladder-head .small{display:none}
  .spec .ladder{max-height:60vh!important}
  .ticker .card{padding:12px}
  .handoff{min-height:60vh;padding:20px}
  .cfg-grid{grid-template-columns:1fr}
}

</style>
