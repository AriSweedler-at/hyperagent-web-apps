# Plays the deployed page every night (docs/MIGRATION.md step 15, docs/ARCHITECTURE.md "CI").
# ci.yml proves the code on emulated origins; this proves the bytes GitHub Pages actually serves at
# https://arisweedler-at.github.io/hyperagent-web-apps/ still play: the @online specs (gin
# join/deal/turn, gin resume/rejoin, fidice lobby/start) and the @relay specs (both games with
# ?ice-policy=relay, every candidate through the relay) open the deployed pages with the same hooks
# the PR harness uses, ?peer= naming a PeerServer on this runner, ?ice= naming an ICE list served
# from this runner and the coturn started on it. Nothing Cloudflare is in the loop: not
# games.sweedler.com (the `proxy` project does not exist here), not turn.sweedler.com, not the
# public broker; the zone's bot protection challenged this runner once (issue #19) and the owner
# ruled that no test depends on Cloudflare. E2E_TARGET=deployed (e2e/fixtures/site.ts) is the
# switch. On failure the Playwright report is uploaded and the open issue labelled `nightly` gets
# a comment with the run URL (or the issue is created); a green run closes it. By hand:
#   gh workflow run nightly.yml
name: Nightly

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deployed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # The relay the deployed page is forced through (as in ci.yml's e2e job): the Debian package
      # starts a system turnserver on :3478, stopped so the harness can bind its own.
      - name: Install coturn for the relay-forced games
        run: |
          sudo apt-get update
          sudo apt-get install -y coturn
          sudo systemctl disable --now coturn || true
      # `npm run test:deployed` is `E2E_TARGET=deployed npm run test:e2e -- --grep "@online|@relay"`:
      # the build only feeds the local serve-dist that hosts the ICE lists; the pages under test are
      # the deployed ones, on the `pages` project alone.
      # The full legacy-replay corpus: every push plays 400 seeded games (test/parity/gin.replay.ts),
      # the nightly all 1000, so a rare seed still gets its comparison.
      - name: Gin engine parity over the full 1000-game replay
        run: GIN_REPLAY_GAMES=1000 npm test -- test/parity/gin.replay
      # The backgammon engine's seeded replay (web/games/backgammon/src/engine/replay.test.ts): every
      # push plays 91 matches, the nightly 1000, so a rare dice stream still meets every invariant.
      - name: Backgammon engine invariants over 1000 seeded matches
        run: BG_REPLAY_GAMES=1000 npm test -- web/games/backgammon/src/engine/replay
      - name: Online and relay-forced specs against the deployed page
        run: npm run test:deployed
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: playwright-report
          retention-days: 14
      - name: Report the failure on the pinned `nightly` issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly --description "Opened by nightly.yml when the deployed run fails" --color B60205 || true
          open_issue="$(gh issue list --label nightly --state open --limit 1 --json number --jq '.[0].number // empty')"
          body="Nightly deployed run failed: ${RUN_URL}"
          if [ -n "${open_issue}" ]; then
            gh issue comment "${open_issue}" --body "${body}"
          else
            gh issue create --title "Nightly deployed run failed" --label nightly --body "${body}"
          fi
      - name: Close the `nightly` issue on a green run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Assigned first so `set -e` sees a gh failure; a substitution inside `for` would exit 0.
          numbers="$(gh issue list --label nightly --state open --json number --jq '.[].number')"
          for number in ${numbers}; do
            gh issue close "${number}" --comment "Nightly deployed run passed: ${RUN_URL}"
          done
