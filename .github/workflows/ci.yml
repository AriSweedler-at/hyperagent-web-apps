# Runs on every push and pull request. Today this is the node:test suites (Cloudflare Worker
# path mapping); typecheck, lint, build and browser e2e jobs join as the TypeScript toolchain lands
# (see docs/ARCHITECTURE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else echo "no lockfile yet; nothing to install"; fi
      - name: Unit tests
        run: npm test
