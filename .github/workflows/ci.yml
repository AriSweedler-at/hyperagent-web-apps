# Runs on every push to main and every pull request. Job "check" is the same gate as the local
# pre-push hook (typecheck, lint, unit tests) plus coverage and a sanity check of the hook shims.
# Build, dist tests, browser e2e and deploy jobs join as docs/MIGRATION.md steps 3-4 land
# (see docs/ARCHITECTURE.md "GitHub Actions").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and format check
        run: npm run lint
      - name: Unit tests with coverage
        run: npm test -- --coverage
      - name: Verify git hook wiring
        run: npm run hooks:verify
