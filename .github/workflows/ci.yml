# Runs on every push to main, every pull request and by hand. The graph (docs/design/test-partition.md
# §6; docs/ARCHITECTURE.md "GitHub Actions"): job "changes" diffs the PR against its base through
# tools/ci/affected.ts and emits one boolean per job plus the two JSON lists of game suites the
# matrix jobs expand; on a push to main or a workflow_dispatch it selects everything, since main
# must prove everything before it deploys. Job "check" (typecheck, lint, the hook shims) always
# runs, beside "changes", so the diff's fifteen seconds hide behind it. Every other job needs
# "changes" and is gated on its output: one job per shared, site and harness vitest suite of
# tools/ci/suites.ts (`if: needs.changes.outputs.<job> == 'true'`), and the game suites as ONE
# matrix job "game" over `fromJSON(needs.changes.outputs.games)` (a fourth game edits this file
# nowhere: dry-round-2.md I1), each run once and under v8 coverage against its own threshold rows
# (`npm run test:<suite> -- --coverage`; "harness" has no rows, "shared-integration" is the
# transport contract in Chromium), "site" building dist/ first and uploading it as the artifact
# "deploy" publishes, and the Playwright runs: the matrix job "e2e-game" over `e2e-games` plus
# "e2e-site" (`npm run test:e2e:<suite>`: both emulated origins, the two-peer games through a
# local PeerServer, the relay-forced games through the coturn .github/actions/coturn installs, the
# stories spec against the committed linux baselines under e2e/__screenshots__ that
# stories-baselines.yml records). A matrix job is skipped whole when its list is `[]` (GitHub
# refuses an empty matrix), and `fail-fast: false` keeps one game's failure from cancelling the
# others, as separate jobs never did. The checks read "game (gin)" and "e2e-game (gin)": no `name:`
# override, since a job skipped before its matrix expands would show the raw expression. Which
# change runs what is the table in tools/ci/suites.ts: a game's folder runs that game, the site and
# the harness; web/shared/** and anything that configures, builds or drives the tests runs
# everything; docs run only "check". Job "broker" repeats the online specs through the real
# 0.peerjs.com and is advisory (continue-on-error, outside ci-ok). Job "ci-ok" is the one gate a
# human or a branch rule watches: `if: always()`, green when every needed job succeeded or was
# skipped, red on a failure or a cancellation, "changes" itself among the needed so a crash in the
# selector cannot pass as a run with no suites (GitHub skips a job whose `needs` were skipped unless
# it says always(), so "deploy" cannot need the suite jobs directly). Job "deploy" publishes the
# checked dist/ to GitHub Pages on a push to main once ci-ok is green; Settings > Pages > Source
# must be "GitHub Actions" (README "Deploy"). Chromium is restored from actions/cache by Playwright
# version (.github/actions/playwright-chromium); dependency installs go through
# .github/actions/npm-ci, which points the runner's copy of the lockfile at the public registry
# (the committed one names Airtable's Socket Firewall) and scans the install. nightly.yml plays the
# online and relay-forced specs against the deployed page every night and reports on a pinned issue.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which jobs this change selects (tools/ci/affected.ts over tools/ci/suites.ts). Node builtins
  # only, so no npm ci; fetch-depth 0 so the PR's base is there to diff against.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared: ${{ steps.affected.outputs.shared }}
      shared-integration: ${{ steps.affected.outputs.shared-integration }}
      site: ${{ steps.affected.outputs.site }}
      harness: ${{ steps.affected.outputs.harness }}
      e2e-site: ${{ steps.affected.outputs.e2e-site }}
      # The game suites selected, unit side and e2e side, as JSON lists for the two matrix jobs.
      games: ${{ steps.affected.outputs.games }}
      e2e-games: ${{ steps.affected.outputs.e2e-games }}
      everything: ${{ steps.affected.outputs.everything }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select the jobs the diff touches (everything on a push to main or by hand)
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node --experimental-strip-types tools/ci/affected.ts --base "origin/$BASE"
            node --experimental-strip-types tools/ci/affected.ts --base "origin/$BASE" --github | tee -a "$GITHUB_OUTPUT"
          else
            node --experimental-strip-types tools/ci/affected.ts --all --github | tee -a "$GITHUB_OUTPUT"
          fi

  # Always: the static gate, and the hook shims parse.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and format check
        run: npm run lint
      - name: Verify git hook wiring
        run: npm run hooks:verify

  # ---- one job per vitest suite, each under coverage against its own rows ----------------------
  shared:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: web/shared unit tests and the two legacy oracles, with coverage
        run: npm run test:shared -- --coverage

  # The real Transport (PeerJS) needs a browser: a PeerServer, a Vite dev server and Chromium are
  # started by the test itself (docs/MIGRATION.md step 5). It skips where loopback WebRTC is
  # blocked; the runner has none of that, so here it runs for real.
  shared-integration:
    needs: changes
    if: needs.changes.outputs.shared-integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Install Chromium
        uses: ./.github/actions/playwright-chromium
      - name: Transport integration (real PeerJS through a local PeerServer)
        run: npm run test:shared-integration

  # The game suites (tools/ci/suites.ts GAME_SUITES), one matrix entry each: its unit tests,
  # parity oracles, fixture pins and seeded replays, with coverage.
  game:
    needs: changes
    if: needs.changes.outputs.games != '[]'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.games) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Unit tests, parity oracles and fixture pins of the suite, with coverage
        run: npm run test:${{ matrix.suite }} -- --coverage

  # Builds dist/, then the guards over it (relative asset URLs, paths on both origins, module
  # pages, the landing page's parity with web/, the class contract), the token and ratchet pins and
  # the Worker's table tests with coverage; uploads dist/ for "deploy".
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Build dist and run the site guards, with coverage
        run: npm run test:site -- --coverage
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          # .nojekyll is a dotfile; upload-artifact v4 drops hidden files unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  harness:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: The harness testing itself (the two origins, the legacy pins, the registry, the suite table)
        run: npm run test:harness

  # ---- the Playwright runs: one matrix job over the game suites, one job for the site ------------
  # `npm run test:e2e:<suite>` builds dist/ first (deterministic, under a second), then plays that
  # suite's specs on both emulated origins with four workers. The @relay specs (every game has
  # one) play through a TURN relay of the harness's own: playwright.config.ts starts
  # `turnserver` on :3478 once the coturn action has stopped the system one. The site suite has no
  # relay spec, so it runs with E2E_TURN=off and installs no coturn.
  e2e-game:
    needs: changes
    if: needs.changes.outputs.e2e-games != '[]'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.e2e-games) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Install Chromium
        uses: ./.github/actions/playwright-chromium
      - name: Install coturn for the relay-forced games
        uses: ./.github/actions/coturn
      - name: The suite's specs and its describes of the shell specs on both origins against dist (local PeerServer and TURN; gin's stories baselines)
        run: npm run test:e2e:${{ matrix.suite }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report
          retention-days: 7

  e2e-site:
    needs: changes
    if: needs.changes.outputs.e2e-site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_TURN: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Install Chromium
        uses: ./.github/actions/playwright-chromium
      - name: Smoke every page on both origins and the six computed-style goldens
        run: npm run test:e2e:site
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-site
          path: playwright-report
          retention-days: 7

  # Advisory: the online and relay-forced specs of every game through the real 0.peerjs.com (the
  # TURN relay stays the local coturn), so a signalling regression is visible at review without a
  # third party blocking a merge. Not in ci-ok's list.
  broker:
    needs: changes
    if: needs.changes.outputs.e2e-games != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      E2E_BROKER: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Install Chromium
        uses: ./.github/actions/playwright-chromium
      - name: Install coturn for the relay-forced games
        uses: ./.github/actions/coturn
      - name: Online and relay-forced specs through 0.peerjs.com (advisory)
        run: npm run test:e2e -- --grep "@online|@relay"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-broker
          path: playwright-report
          retention-days: 7

  # The one gate: "changes" ran and every needed job succeeded or was skipped by it. A failure or a
  # cancellation anywhere turns it red; always() is what lets it run beside skipped jobs. "changes"
  # is in the list on purpose: without it a crash in the selector skips every gated job, and
  # skipped is green here, so a PR that broke tools/ci/suites.ts would pass with no suite run. A
  # matrix job reports one result for all its entries (skipped when its list was `[]`, failure or
  # cancelled when any entry was), so "game" and "e2e-game" stand for the six jobs they replaced.
  ci-ok:
    needs:
      - changes
      - check
      - shared
      - shared-integration
      - game
      - site
      - harness
      - e2e-game
      - e2e-site
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$NEEDS" | jq -e 'to_entries | map(select(.value.result != "success" and .value.result != "skipped")) | length == 0' > /dev/null

  # Publishes the dist/ that "site" built and tested (on main every job runs, so it is there).
  # Nothing is installed here: the artifact is the whole input. Requires Settings > Pages > Source
  # = GitHub Actions (one-time; README "Deploy").
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ok.result == 'success'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Download the checked dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Served URLs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Deployed"
            echo "- ${PAGE_URL}"
            echo "- https://games.sweedler.com/ (Cloudflare Worker infra/games-proxy in front of the URL above)"
          } >> "$GITHUB_STEP_SUMMARY"
