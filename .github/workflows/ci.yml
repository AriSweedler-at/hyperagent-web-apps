# Runs on every push to main and every pull request. Job "check" is the same gate as the local
# pre-push hook (typecheck, lint, unit tests, build, dist guards) plus coverage and a sanity check
# of the hook shims; it uploads dist/ as the artifact job "deploy" publishes. Job "e2e" plays the
# two-peer browser specs on both emulated origins against a fresh build of dist/, and the ported
# pages on the dark dist-next/ build (project `next`, docs/MIGRATION.md step 6), through a local
# PeerServer (the merge gate for online play, docs/MIGRATION.md step 3); job "broker" repeats the
# online specs through the real 0.peerjs.com and is advisory (continue-on-error), so a third-party
# outage never blocks a merge but a signalling regression is visible at review. Job "deploy"
# (docs/MIGRATION.md step 4) publishes the checked dist/ to GitHub Pages on a push to main once
# check and e2e are green; Settings > Pages > Source must be "GitHub Actions" for it to take
# effect (see README "Deploying"). Dependency installs go through .github/actions/npm-ci: the
# lockfile names Airtable's Socket Firewall registry, which runners cannot reach, so npm
# substitutes the public registry at install time and Socket Firewall Free scans what it downloads.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and format check
        run: npm run lint
      - name: Unit tests with coverage
        run: npm test -- --coverage
      # The real Transport (PeerJS) needs a browser: a PeerServer, a Vite dev server and Chromium
      # are started by the test itself (docs/MIGRATION.md step 5). It skips where loopback WebRTC
      # is blocked; the runner has none of that, so here it runs for real.
      - name: Install Chromium for the transport integration test
        run: npx playwright install --with-deps chromium
      - name: Transport integration (real PeerJS through a local PeerServer)
        run: npm run test:integration
      - name: Build dist
        run: npm run build
      # The same build with LEGACY_PAGES= (docs/MIGRATION.md step 6): the ported fidice page as
      # Vite emits it, which the e2e project `next` plays and the dist guards check alongside dist/.
      - name: Build dist-next
        run: npm run build:next
      - name: Dist guards (relative asset URLs, paths on both origins, parity with legacy/; dist/ and dist-next/)
        run: npm run test:dist
      - name: Verify git hook wiring
        run: npm run hooks:verify
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          # .nojekyll is a dotfile; upload-artifact v4 drops hidden files unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # `npm run test:e2e` builds dist/ and dist-next/ first (deterministic, under a second each),
      # so the specs run against the same output "check" uploaded. Projects: pages, proxy and next;
      # the fidice-online spec on `next` is the proof that the dark page plays a real two-peer game.
      - name: Browser specs on both origins against dist, and on the dark build (local PeerServer)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  broker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      E2E_BROKER: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        uses: ./.github/actions/npm-ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Online specs through 0.peerjs.com (advisory)
        run: npm run test:e2e -- --grep @online
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-broker
          path: playwright-report
          retention-days: 7

  # Publishes the dist/ that "check" built and tested. Nothing is installed here: the artifact is
  # the whole input. Requires Settings > Pages > Source = GitHub Actions (one-time; README "Deploying").
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Download the checked dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Served URLs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Deployed"
            echo "- ${PAGE_URL}"
            echo "- https://games.sweedler.com/ (Cloudflare Worker infra/games-proxy in front of the URL above)"
          } >> "$GITHUB_STEP_SUMMARY"
